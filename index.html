<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="人工智能平台产品实现（初级）学习系统公开版：理论学习助手与 JupyterLab 实操训练。">
  <title>人工智能平台产品实现（初级）学习系统</title>
  <style>
    :root{--ink:#173d35;--muted:#5e746c;--mint:#e6f4ed;--line:#d9e7df;--gold:#e7b563;--paper:#fbfcfa}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:linear-gradient(145deg,#edf8f1,var(--paper) 55%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}
    main{width:min(960px,calc(100% - 32px));margin:0 auto;padding:72px 0}.eyebrow{letter-spacing:.13em;font-size:12px;font-weight:800;color:#2f7661}.hero{background:rgba(255,255,255,.88);border:1px solid var(--line);border-radius:24px;padding:36px;box-shadow:0 20px 60px rgba(23,61,53,.09)}h1{margin:0;font-size:clamp(28px,5vw,48px);line-height:1.18;letter-spacing:-.05em}p{color:var(--muted);font-size:16px}.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.btn{display:inline-block;padding:11px 17px;border-radius:12px;text-decoration:none;font-weight:800;border:1px solid var(--line);color:var(--ink);background:#fff}.primary{background:var(--ink);color:#fff;border-color:var(--ink)}.warm{background:var(--gold);border-color:var(--gold)}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:20px}.card{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:18px;padding:18px}.card strong{display:block;font-size:18px;margin-bottom:5px}.card span{color:var(--muted);font-size:14px}@media(max-width:700px){main{padding:32px 0}.hero{padding:24px}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
<main>
  <section class="hero">
    <div class="eyebrow">AI PLATFORM STUDY SYSTEM</div>
    <h1>人工智能平台产品实现（初级）学习系统</h1>
    <p>面向中国大陆用户的本地学习系统，连接理论理解、代码填空和 JupyterLab 运行验证。公开版提供完整理论学习助手和可运行的实操训练。</p>
    <div class="actions">
      <a class="btn primary" href="theory/">打开理论学习助手</a>
      <a class="btn warm" href="https://github.com/13306518212/ai-platform-study-system-showcase#启动公开版实操训练">启动实操训练</a>
      <a class="btn" href="https://github.com/13306518212/ai-platform-study-system-showcase">查看 GitHub 仓库</a>
    </div>
  </section>
  <section class="grid">
    <div class="card"><strong>理论学习</strong><span>完整理论题集、解析、复习和学习记录。</span></div>
    <div class="card"><strong>实操训练</strong><span>13 道题、60 个填空位，完整判分和运行验证。</span></div>
    <div class="card"><strong>本地优先</strong><span>答题记录和 Jupyter 运行环境保留在本机。</span></div>
  </section>
</main>
</body>
</html>
